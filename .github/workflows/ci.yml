name: CI

on:
  push:
    branches: [ master, feature/native-web-bundle ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DemosToDiscord/DemosToDiscord.csproj
      - name: Build
        run: dotnet build DemosToDiscord/DemosToDiscord.csproj -c Release --no-restore
      - name: Upload native web bundle
        uses: actions/upload-artifact@v4
        with:
          name: DemosToDiscord-native-web-bundle
          path: DemosToDiscord/bin/Release/DemosToDiscord.zip

