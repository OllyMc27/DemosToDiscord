name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DemosToDiscord.sln
      - name: Test
        run: dotnet test --solution DemosToDiscord.sln -c Release --no-restore
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DemosToDiscord
          path: DemosToDiscord/bin/Release/net10.0/DemosToDiscord.dll

