name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DemosToDiscord.sln
      - name: Test and build
        run: dotnet test --solution DemosToDiscord.sln -c Release --no-restore
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DemosToDiscord/bin/Release/net10.0/DemosToDiscord.dll

